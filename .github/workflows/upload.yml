name: Upload stored supplements to Telegram
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List pending files without sending anything"
        type: boolean
        default: false
      max_files:
        description: "Maximum send attempts PER BOT (0 = all within time budget)"
        type: string
        default: "0"
  schedule:
    - cron: "59 */5 * * *"
permissions:
  contents: write
concurrency:
  group: telegram-uploader
  cancel-in-progress: false
jobs:
  upload:
    name: upload (${{ matrix.reviewer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      # A problem in one bot's shard must not stop the others.
      fail-fast: false
      matrix:
        # One fixed reviewer/channel/bot per job.
        reviewer: [fzm, ajk, mas, kf]
    env:
      SOURCE_REPO: alireza5969/dmsr-supp
      SOURCE_BRANCH: main
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      REVIEWER: ${{ matrix.reviewer }}
      TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.reviewer)] }}
      CHAT_ID: ${{ secrets[format('CHAT_ID_{0}', matrix.reviewer)] }}
      TIME_BUDGET_MIN: "300"
      MAX_FILES: ${{ inputs.max_files || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Configure checkpoint author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Check bot token is configured
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "::error::Both TG_TOKEN_${{ matrix.reviewer }} and CHAT_ID_${{ matrix.reviewer }} must be set"
            exit 1
          fi
      - name: Preview pending uploads
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 uploader.py
      - name: Upload
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        timeout-minutes: 320
        run: python3 uploader.py --run
      - name: Persist remaining progress
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: python3 uploader.py --checkpoint
      - name: Recovery copy of progress
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: uploader-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.reviewer }}
          path: state/
          if-no-files-found: ignore
          retention-days: 30
